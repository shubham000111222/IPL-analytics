name: CI-CD Pipeline

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  ci:
    name: Build and Validate
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Syntax check
        run: |
          python -m compileall src dashboard

      - name: Build SQLite database
        run: |
          python src/data/load_data.py

      - name: Run analytics scripts
        run: |
          python src/analysis/batting.py
          python src/analysis/bowling.py
          python src/analysis/team_strategy.py

      - name: Generate visualizations
        run: |
          python src/viz/plots.py

      - name: Upload generated artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ipl-analytics-results
          path: |
            data/ipl.db
            results/*.png
          if-no-files-found: error

  cd:
    name: Release Snapshot
    runs-on: ubuntu-latest
    needs: ci
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          name: ipl-analytics-results
          path: release-assets

      - name: Publish GitHub release (latest)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest Analytics Snapshot
          body: |
            Automated snapshot generated by GitHub Actions.
            Includes refreshed SQLite DB and generated plots.
          files: |
            release-assets/data/ipl.db
            release-assets/results/*.png
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
